included:
  - SpamWise
  - SpamWise-MAS
  - SpamWise-download
  - MailExtension
  - SpamWiseCore/Sources
  - SpamWiseCore/Tests
  - UnitTests
  - UITests
# swift-format owns layout; these rules disagree with its multiline output.
disabled_rules:
  - opening_brace
  - switch_case_alignment
  - closure_parameter_position
  - optional_data_string_conversion
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true
function_body_length:
  warning: 80
  error: 100
type_body_length:
  warning: 400
  error: 500
cyclomatic_complexity:
  warning: 20
  error: 25
nesting:
  type_level: 2
identifier_name:
  excluded: [id, fd, i, n, p, cf]
opt_in_rules:
  - type_contents_order
type_contents_order:
  order:
    - [type_alias, associated_type]
    - [case]
    - [type_property]
    - [instance_property]
    - [ib_inspectable]
    - [ib_outlet]
    - [initializer]
    - [type_method]
    - [view_life_cycle_method]
    - [ib_action, ib_segue_action]
    - [other_method]
    - [subscript]
    - [deinitializer]
    - [subtype]
