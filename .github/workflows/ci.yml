name: CI

# What CI can and cannot prove. Every real action SpamWise takes goes through Apple Events to Mail,
# which needs a signed app, a configured Mail account and a person to approve Automation; a hosted
# runner has none of these. So nothing here drives Mail. What is covered is everything on either
# side of that boundary: the checks job holds the localization catalogs, the Help book's anchors and
# the project's package references to their rules and runs the corpus and preference tool tests,
# the package tests exercise the pipeline, rules and adapters against fixtures and stubbed Apple
# Events, the unit tests cover the shared app framework, the build job compiles both editions and
# the Mail extension in the Release configuration and checks each edition's icon, the UI tests drive
# the app in its test mode (which denies every Apple Event and keeps state in a temporary store), and
# the documentation job checks the package's DocC. The package, unit and build jobs also fail on any
# compiler, linker or build-system warning their logs report.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # macOS will not launch an unsigned app, and the runner has no certificate or profile, so the UI
  # job signs ad hoc. Its entitlements files are dropped: the App Group and shared Keychain group
  # would demand a provisioning profile, and test mode uses neither. The UITests target requires a
  # profile for its runner, which ad-hoc signing cannot supply, so that requirement is lifted too.
  SIGNING: >-
    CODE_SIGN_IDENTITY=-
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGNING_ALLOWED=YES
    CODE_SIGN_STYLE=Manual
    DEVELOPMENT_TEAM=
    PROVISIONING_PROFILE_SPECIFIER=
    PROVISIONING_PROFILE_REQUIRED=NO
    CODE_SIGN_ENTITLEMENTS=

jobs:
  # Source checks that need no Xcode, so they run on Linux.
  checks:
    name: Source Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check local package references
        run: bash Scripts/check-package-references.sh

      - name: Check localizations
        run: python3 Scripts/check-core-localizations.py

      - name: Check the Help book
        run: python3 Scripts/check-help-book.py

      # The corpus tools stream archives through /usr/bin/bsdtar, which macOS ships and Ubuntu
      # leaves to this package.
      - name: Install bsdtar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Test the corpus tools
        run: python3 -B -m unittest discover -s Tools/Corpus -p 'test_*.py'

      - name: Test the preference probe
        run: python3 -B -m unittest discover -s Tools/Preferences -p 'test_*.py'

  package:
    name: Package Tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .build/swiftpm
          key: swiftpm-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('SpamWiseCore/Package.resolved') }}

      - name: Run package tests
        run: |
          set -o pipefail
          swift test --package-path SpamWiseCore --scratch-path .build/swiftpm \
            -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/package.log"

      - name: Reject build diagnostics
        run: bash Scripts/check-diagnostics.sh "$RUNNER_TEMP/package.log"

  # The SpamWise Common scheme is hostless: it builds the shared framework and its test bundle,
  # needs no signing, and never launches the app.
  unit:
    name: Unit Tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Observation's @Observable macro can fail fingerprint validation on hosted runners; skipping
      # it lets the build resolve the macro implementations.
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      # Exact-match key, no restore-keys: objects built against a different dependency graph or
      # toolchain must never be reused.
      - name: Cache Xcode build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dd-unit/Build
            ${{ runner.temp }}/dd-unit/SourcePackages
          key: derived-unit-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpamWise.xcodeproj \
            -scheme "SpamWise Common" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-unit" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/dd-unit/SourcePackages" \
            -resultBundlePath TestResults-Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/unit.log" | xcbeautify --renderer github-actions

      - name: Reject build diagnostics
        run: bash Scripts/check-diagnostics.sh "$RUNNER_TEMP/unit.log"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-unit
          path: TestResults-Unit.xcresult
          if-no-files-found: ignore

  # Both editions emit SpamWise.app, so the second build replaces the first in the shared derived
  # data, and each edition's icon is checked right after its own build. The extension is built on
  # its own as well, so a break in it reads as an extension failure. Everything builds in the
  # Release configuration a tag ships, with DEBUG code compiled out and whole-module optimization.
  build:
    name: Build Editions
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dd-build/Build
            ${{ runner.temp }}/dd-build/SourcePackages
          key: derived-build-release-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      - name: Build both editions and the Mail extension
        run: |
          set -o pipefail
          for scheme in "SpamWise (MAS)" "SpamWise (download)" MailExtension; do
            echo "::group::Build $scheme"
            xcodebuild build \
              -project SpamWise.xcodeproj \
              -scheme "$scheme" \
              -configuration Release \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$RUNNER_TEMP/dd-build" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/dd-build/SourcePackages" \
              CODE_SIGNING_ALLOWED=NO \
              2>&1 | tee -a "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions
            if [ "$scheme" != MailExtension ]; then
              bash Scripts/check-app-icon.sh "$RUNNER_TEMP/dd-build/Build/Products/Release/SpamWise.app"
            fi
            echo "::endgroup::"
          done

      - name: Reject build diagnostics
        run: bash Scripts/check-diagnostics.sh "$RUNNER_TEMP/build.log"

  # The UITests target lives in the SpamWise test plan of the App Store edition's scheme. Only that
  # bundle runs here; the unit job already covers the other. The registered App Intents test skips
  # itself unless SPAMWISE_INTENTS_TEST is set, which this job never does.
  ui:
    name: UI Tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dd-ui/Build
            ${{ runner.temp }}/dd-ui/SourcePackages
          key: derived-ui-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}

      - name: Run UI tests
        run: |
          set -o pipefail
          # SIGNING holds several settings and must split into separate arguments.
          # shellcheck disable=SC2086
          xcodebuild test \
            -project SpamWise.xcodeproj \
            -scheme "SpamWise (MAS)" \
            -testPlan SpamWise \
            -only-testing:UITests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-ui" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/dd-ui/SourcePackages" \
            -resultBundlePath TestResults-UI.xcresult \
            $SIGNING \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-ui
          path: TestResults-UI.xcresult
          if-no-files-found: ignore

  # The package scheme documents every SpamWiseCore target. DocC reports some of its dependencies'
  # comments too, and those are not ours to fix, so the job fails only on a warning in the
  # package's own sources. The two executables have no public symbols, so DocC also reports their
  # empty archives, without a source path; that warning is expected. Nothing publishes the archive.
  docs:
    name: Documentation
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/dd-docs/Build
            ${{ runner.temp }}/dd-docs/SourcePackages
          key: derived-docs-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('SpamWiseCore/Package.resolved') }}

      - name: Build documentation
        working-directory: SpamWiseCore
        run: |
          set -o pipefail
          xcodebuild docbuild \
            -scheme SpamWiseCore-Package \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/dd-docs" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/dd-docs/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/docbuild.log" | xcbeautify --renderer github-actions

      - name: Reject documentation warnings in package sources
        run: |
          warnings=$(grep -E "^$GITHUB_WORKSPACE/SpamWiseCore/[^:]+:[0-9]+:[0-9]+: warning:" \
            "$RUNNER_TEMP/docbuild.log" | sort -u || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::DocC reported warnings in SpamWiseCore sources."
            exit 1
          fi
