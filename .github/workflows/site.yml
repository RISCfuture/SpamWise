name: Site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'Tools/Site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the approved prerelease site from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install site tools
        run: python -m pip install -r Tools/Site/requirements.txt
      - name: Validate site
        run: |
          python -m ruff check Tools/Site
          python -m ruff format --check Tools/Site
          python Tools/Site/build.py --check
          python -m unittest discover -s Tools/Site
          python Tools/Site/build.py --stage "$RUNNER_TEMP/spamwise-site"
      - name: Upload approved site artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/spamwise-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
