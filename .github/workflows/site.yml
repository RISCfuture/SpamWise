name: Site

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'Tools/Site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the approved prerelease site from main
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Install site tools
        run: python -m pip install -r Tools/Site/requirements.txt
      - name: Validate site
        run: |
          python -m ruff check Tools/Site
          python -m ruff format --check Tools/Site
          python Tools/Site/build.py --check
          python -m unittest discover -s Tools/Site
          python Tools/Site/build.py --stage "$RUNNER_TEMP/spamwise-site"
      - name: Upload approved site artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ${{ runner.temp }}/spamwise-site

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
