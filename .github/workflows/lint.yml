name: Linters

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: Run SwiftLint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # .swiftlint.yml's parent_config is a gist URL that SwiftLint fetches itself, and a slow or
      # unreachable gist fails the run. Fetching it here with retries, then pointing the config at
      # the local copy, takes the network out of the linter's path.
      - name: Pre-fetch parent SwiftLint config
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o .swiftlint-parent.yml \
            'https://gist.githubusercontent.com/RISCfuture/c57d132e5e0160a768df1625e20ae3b8/raw/.swiftlint.yml'
          sed -i '' 's|^parent_config:.*|parent_config: .swiftlint-parent.yml|' .swiftlint.yml
      # A fixed release, checked against its published digest, so a new SwiftLint never turns an
      # unchanged commit red. Raise both values together.
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Run SwiftLint
        run: swiftlint lint --strict --no-cache --reporter github-actions-logging
